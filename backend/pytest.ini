[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
addopts = --strict-markers -m "not perf"
markers =
    db: usa PostgreSQL real via TEST_DATABASE_URL (pula sem a variavel)
    security: testes de seguranca
    perf: desempenho do painel (semente grande; fora da suite padrao, rode com -m perf)
