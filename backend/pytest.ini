[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
addopts = --strict-markers -m "not perf and not e2e"
markers =
    db: usa PostgreSQL real via TEST_DATABASE_URL (pula sem a variavel)
    security: testes de seguranca
    perf: desempenho do painel (semente grande; fora da suite padrao, rode com -m perf)
    e2e: navegador real (Playwright + Chromium) contra o painel numa porta local; fora da suite padrao, rode com -m e2e
