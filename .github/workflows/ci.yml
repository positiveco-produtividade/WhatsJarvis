name: CI

# Cobre o que o desenvolvimento local nao cobre: Python 3.12 e PostgreSQL 16
# (a producao usa as duas; a maquina de desenvolvimento tem 3.14 e PG 18).
# As credenciais abaixo existem so dentro do container efemero do job; nao sao segredos.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jarvis_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_ci -d jarvis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # O nome do banco termina em _test, exigido pela suite (ela faz TRUNCATE).
      # A aplicacao e a suite usam o papel jarvis_test, SEM superusuario (a suite exige isso);
      # o superusuario do servico (jarvis_ci) so e usado no passo "Preparar papeis".
      DATABASE_URL: postgresql://jarvis_test:ci-only-not-a-secret@localhost:5432/jarvis_test
      TEST_DATABASE_URL: postgresql://jarvis_test:ci-only-not-a-secret@localhost:5432/jarvis_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      # Espelha backend/scripts/dev_db_setup.sql. Senha so de CI (container efemero, nao e segredo).
      - name: Preparar papeis (superusuario so aqui)
        env:
          PGPASSWORD: ci-only-not-a-secret
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U jarvis_ci -d postgres <<'SQL'
          CREATE ROLE jarvis_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-only-not-a-secret';
          CREATE ROLE jarvis_assistant LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-only-not-a-secret';
          ALTER DATABASE jarvis_test OWNER TO jarvis_test;
          REVOKE ALL ON DATABASE jarvis_test FROM PUBLIC;
          GRANT jarvis_assistant TO jarvis_test;
          SQL

      - name: Aplicar migrations
        run: python -m app.db.migrate

      - name: Migrations em dia
        run: python -m app.db.migrate --check

      - name: Testes
        run: python -m pytest -q

      - name: Lint
        run: python -m ruff check app tests

      - name: Tipos
        run: python -m mypy app
